<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kitBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Quai xach -->
  <path d="M 44 26 C 44 14, 84 14, 84 26" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <!-- Than hop y te -->
  <rect x="14" y="26" width="100" height="84" rx="14" fill="url(#kitBody)" stroke="#334155" stroke-width="6" filter="url(#shadow)"/>
  <!-- Dai nep khoa -->
  <rect x="14" y="62" width="100" height="4" fill="#c7d9c4"/>
  <rect x="26" y="58" width="14" height="12" rx="2" fill="#475569"/>
  <rect x="88" y="58" width="14" height="12" rx="2" fill="#475569"/>
  <!-- Dau thap do y te -->
  <rect x="54" y="38" width="20" height="52" rx="4" fill="url(#crossGrad)"/>
  <rect x="38" y="54" width="52" height="20" rx="4" fill="url(#crossGrad)"/>
  <!-- Vong vien sang bong goc -->
  <path d="M 22 34 Q 28 30 38 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>